<style>

    height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500;

</style>

<script>
/* ============================================================
   Marcador — gerenciador de links e favoritos
   Estado em memória + persistência em LocalStorage
   ============================================================ */

const STORE_KEY = 'marcador:v1';

const PALETTE = [
  { name: 'violeta',  hex: '#6c5cff' },
  { name: 'azul',     hex: '#3b82f6' },
  { name: 'ciano',    hex: '#06b6d4' },
  { name: 'verde',    hex: '#10b981' },
  { name: 'âmbar',    hex: '#f59e0b' },
  { name: 'laranja',  hex: '#f97316' },
  { name: 'rosa',     hex: '#ec4899' },
  { name: 'cinza',    hex: '#8b8b94' }
];

let state = {
  folders: [],
  links: [],
  activeFolder: 'all',
  query: '',
  editingLinkId: null,
  editingFolderId: null,
  pickedColor: PALETTE[0].hex
};

/* ---------- persistência ---------- */

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return seed();
    const data = JSON.parse(raw);
    state.folders = Array.isArray(data.folders) ? data.folders : [];
    state.links   = Array.isArray(data.links)   ? data.links   : [];
  } catch (e) {
    console.warn('Não foi possível ler os dados salvos:', e);
    seed();
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ folders: state.folders, links: state.links }));
  } catch (e) {
    toast('Não deu para salvar. O armazenamento do navegador está cheio ou bloqueado.', 'error');
  }
}

function seed() {
  state.folders = [
    { id: uid(), name: 'Leitura', color: '#6c5cff' },
    { id: uid(), name: 'Trabalho', color: '#10b981' }
  ];
  state.links = [];
  save();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- utilidades de URL ---------- */

function normalizeUrl(input) {
  let v = (input || '').trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try {
    const u = new URL(v);
    if (!u.hostname.includes('.') || u.hostname.startsWith('.') || u.hostname.endsWith('.')) return null;
    return u.href;
  } catch { return null; }
}

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return url; }
}

/* ---------- seleção de elementos ---------- */

const $ = (sel) => document.querySelector(sel);
const el = {
  sidebar: $('#sidebar'), overlay: $('#overlay'),
  folderList: $('#folderList'), allCount: $('#allCount'), countLabel: $('#countLabel'),
  grid: $('#grid'), empty: $('#empty'),
  viewTitle: $('#viewTitle'), viewSubtitle: $('#viewSubtitle'),
  search: $('#search'), clearSearch: $('#btnClearSearch'),
  linkModal: $('#linkModal'), folderModal: $('#folderModal'), confirmModal: $('#confirmModal'),
  fUrl: $('#fUrl'), fTitle: $('#fTitle'), fDesc: $('#fDesc'), fFolder: $('#fFolder'), urlError: $('#urlError'),
  fFolderName: $('#fFolderName'), folderError: $('#folderError'), swatches: $('#swatches'),
  toast: $('#toast'), toastText: $('#toastText'), toastIcon: $('#toastIcon')
};

/* ---------- ícones ---------- */

const icon = (d, w = 1.8) =>
  `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const ICONS = {
  copy:   '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  edit:   '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:  '<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/>',
  check:  '<path d="m5 13 4 4L19 7"/>',
  alert:  '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:   '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};

/* ---------- avisos flutuantes ---------- */

let toastTimer;
function toast(message, kind = 'ok') {
  el.toastIcon.innerHTML = icon(kind === 'ok' ? ICONS.check : ICONS.alert, 2.2);
  el.toastText.textContent = message;
  el.toast.classList.remove('opacity-0', 'translate-y-2');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.add('opacity-0', 'translate-y-2'), 2400);
}

/* ---------- renderização: pastas ---------- */

function renderFolders() {
  el.folderList.innerHTML = '';

  if (state.folders.length === 0) {
    el.folderList.innerHTML =
      `<p class="px-2.5 py-3 text-[13px] leading-relaxed text-neutral-500">
         Nenhuma pasta ainda. Crie a primeira no <span class="text-accent">+</span> acima.
       </p>`;
  }

  state.folders.forEach(folder => {
    const count = state.links.filter(l => l.folderId === folder.id).length;
    const row = document.createElement('div');
    row.className = 'group relative';
    row.innerHTML = `
      <button data-folder="${folder.id}"
        class="folder-item w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm transition-colors">
        <span class="h-2.5 w-2.5 rounded-[4px] shrink-0" style="background:${folder.color}"></span>
        <span class="flex-1 text-left truncate">${escapeHtml(folder.name)}</span>
        <span class="text-[11px] tabular-nums text-neutral-500 group-hover:opacity-0 transition-opacity">${count}</span>
      </button>
      <div class="absolute right-1.5 top-1/2 -translate-y-1/2 hidden group-hover:flex gap-0.5">
        <button data-edit-folder="${folder.id}" title="Renomear pasta"
          class="h-6 w-6 grid place-items-center rounded-md text-neutral-500 hover:text-accent hover:bg-accent/10 transition-colors">${icon(ICONS.edit)}</button>
        <button data-del-folder="${folder.id}" title="Excluir pasta"
          class="h-6 w-6 grid place-items-center rounded-md text-neutral-500 hover:text-rose-500 hover:bg-rose-500/10 transition-colors">${icon(ICONS.trash)}</button>
      </div>`;
    el.folderList.appendChild(row);
  });

  document.querySelectorAll('[data-folder]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.folder === state.activeFolder);
  });

  el.allCount.textContent = state.links.length;
  el.countLabel.textContent = state.links.length === 1 ? '1 link salvo' : `${state.links.length} links salvos`;
}

/* ---------- renderização: links ---------- */

function visibleLinks() {
  const q = state.query.trim().toLowerCase();
  return state.links
    .filter(l => state.activeFolder === 'all' || l.folderId === state.activeFolder)
    .filter(l => {
      if (!q) return true;
      return (l.title || '').toLowerCase().includes(q)
          || (l.desc  || '').toLowerCase().includes(q)
          || (l.url   || '').toLowerCase().includes(q);
    })
    .sort((a, b) => b.createdAt - a.createdAt);
}

function renderLinks() {
  const items = visibleLinks();
  const folder = state.folders.find(f => f.id === state.activeFolder);

  el.viewTitle.textContent = folder ? folder.name : 'Todos os links';
  el.viewSubtitle.textContent = state.query
    ? `${items.length} ${items.length === 1 ? 'resultado' : 'resultados'} para “${state.query}”`
    : (folder ? `${items.length} ${items.length === 1 ? 'link nesta pasta' : 'links nesta pasta'}` : 'Tudo o que você guardou até agora');

  el.grid.innerHTML = '';

  if (items.length === 0) {
    el.grid.classList.add('hidden');
    el.empty.classList.remove('hidden');
    el.empty.innerHTML = emptyState(folder);
    return;
  }

  el.grid.classList.remove('hidden');
  el.empty.classList.add('hidden');

  items.forEach(link => {
    const f = state.folders.find(x => x.id === link.folderId);
    const host = hostOf(link.url);
    const card = document.createElement('article');
    card.className = `group relative flex flex-col rounded-xl p-4
                      bg-white dark:bg-raised-dark border border-line dark:border-line-dark
                      hover:border-accent/50 dark:hover:border-accent/50 transition-colors`;
    card.innerHTML = `
      <div class="flex items-start gap-3">
        <div class="h-9 w-9 shrink-0 rounded-lg grid place-items-center overflow-hidden
                    bg-neutral-100 dark:bg-white/[.06] text-[13px] font-semibold text-neutral-500">
          <img src="https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}"
               alt="" class="h-5 w-5" onerror="this.remove()" />
        </div>
        <div class="min-w-0 flex-1">
          <a href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer"
             class="block font-medium text-[14.5px] leading-snug text-neutral-900 dark:text-white hover:text-accent dark:hover:text-accent-soft transition-colors truncate">
            ${escapeHtml(link.title || link.url)}
          </a>
          <p class="text-[12px] text-neutral-500 truncate mt-0.5">${escapeHtml(host)}</p>
        </div>
      </div>

      ${link.desc ? `<p class="text-[13px] leading-relaxed text-neutral-600 dark:text-neutral-400 mt-3 line-clamp-3">${escapeHtml(link.desc)}</p>` : ''}

      <div class="flex items-center justify-between gap-2 mt-4 pt-3 border-t border-line dark:border-line-dark">
        ${f ? `<span class="inline-flex items-center gap-1.5 text-[11.5px] text-neutral-500 min-w-0">
                 <span class="h-2 w-2 rounded-[3px] shrink-0" style="background:${f.color}"></span>
                 <span class="truncate">${escapeHtml(f.name)}</span>
               </span>` : `<span class="text-[11.5px] text-neutral-500">Sem pasta</span>`}
        <div class="flex gap-0.5 shrink-0 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
          <button data-copy="${link.id}" title="Copiar endereço"
            class="h-7 w-7 grid place-items-center rounded-md text-neutral-500 hover:text-accent hover:bg-accent/10 transition-colors">${icon(ICONS.copy)}</button>
          <button data-edit="${link.id}" title="Editar link"
            class="h-7 w-7 grid place-items-center rounded-md text-neutral-500 hover:text-accent hover:bg-accent/10 transition-colors">${icon(ICONS.edit)}</button>
          <button data-del="${link.id}" title="Excluir link"
            class="h-7 w-7 grid place-items-center rounded-md text-neutral-500 hover:text-rose-500 hover:bg-rose-500/10 transition-colors">${icon(ICONS.trash)}</button>
        </div>
      </div>`;
    el.grid.appendChild(card);
  });
}

function emptyState(folder) {
  const box = (title, text, action = '') => `
    <div class="rounded-xl border border-dashed border-line dark:border-line-dark py-14 px-6 text-center">
      <div class="h-11 w-11 mx-auto rounded-xl grid place-items-center bg-accent/10 text-accent">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/>
        </svg>
      </div>
      <p class="mt-4 text-[15px] font-medium text-neutral-900 dark:text-white">${title}</p>
      <p class="mt-1.5 text-[13px] leading-relaxed text-neutral-500 max-w-sm mx-auto">${text}</p>
      ${action}
    </div>`;

  if (state.query) {
    return box('Nada encontrado',
      `Nenhum link combina com “${escapeHtml(state.query)}”. Tente outra palavra ou volte para todos os links.`,
      `<button onclick="document.querySelector('#search').value='';document.querySelector('#search').dispatchEvent(new Event('input'))"
         class="btn-ghost mt-4 inline-flex">Limpar busca</button>`);
  }

  if (folder) {
    return box('Nenhum link salvo nesta pasta',
      `A pasta ${escapeHtml(folder.name)} está vazia. Salve o primeiro endereço aqui.`,
      `<button onclick="openLinkModal()" class="btn-primary mt-4 inline-flex items-center">Adicionar link</button>`);
  }

  return box('Comece guardando um link',
    'Cole qualquer endereço, dê um título e escolha uma pasta. Tudo fica salvo neste navegador.',
    `<button onclick="openLinkModal()" class="btn-primary mt-4 inline-flex items-center">Adicionar link</button>`);
}

function render() { renderFolders(); renderLinks(); }

/* ---------- escape ---------- */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
const escapeAttr = escapeHtml;

/* ---------- modal: link ---------- */

function fillFolderSelect(selectedId) {
  el.fFolder.innerHTML = '';
  if (state.folders.length === 0) {
    el.fFolder.innerHTML = '<option value="">Sem pasta</option>';
    return;
  }
  state.folders.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = f.name;
    if (f.id === selectedId) opt.selected = true;
    el.fFolder.appendChild(opt);
  });
}

function openLinkModal(linkId = null) {
  state.editingLinkId = linkId;
  const link = linkId ? state.links.find(l => l.id === linkId) : null;

  $('#linkModalTitle').textContent = link ? 'Editar link' : 'Novo link';
  $('#btnSaveLink').textContent = link ? 'Salvar alterações' : 'Salvar link';
  el.fUrl.value = link ? link.url : '';
  el.fTitle.value = link ? (link.title || '') : '';
  el.fDesc.value = link ? (link.desc || '') : '';
  el.urlError.classList.add('hidden');

  const preselect = link ? link.folderId : (state.activeFolder !== 'all' ? state.activeFolder : (state.folders[0] && state.folders[0].id));
  fillFolderSelect(preselect);

  show(el.linkModal);
  setTimeout(() => el.fUrl.focus(), 40);
}

function saveLink() {
  const url = normalizeUrl(el.fUrl.value);
  if (!url) {
    el.urlError.textContent = 'Esse endereço não parece válido. Use algo como exemplo.com ou https://exemplo.com/pagina.';
    el.urlError.classList.remove('hidden');
    el.fUrl.focus();
    return;
  }

  const payload = {
    url,
    title: el.fTitle.value.trim(),
    desc: el.fDesc.value.trim(),
    folderId: el.fFolder.value || null
  };

  if (state.editingLinkId) {
    const i = state.links.findIndex(l => l.id === state.editingLinkId);
    state.links[i] = { ...state.links[i], ...payload };
    toast('Link atualizado');
  } else {
    state.links.unshift({ id: uid(), createdAt: Date.now(), ...payload });
    toast('Link salvo');
  }

  save(); render(); hide(el.linkModal);
}

/* ---------- modal: pasta ---------- */

function renderSwatches() {
  el.swatches.innerHTML = '';
  PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.title = c.name;
    b.dataset.color = c.hex;
    b.className = 'h-8 w-8 rounded-lg transition-transform hover:scale-110';
    b.style.background = c.hex;
    b.style.boxShadow = c.hex === state.pickedColor ? `0 0 0 2px #fff, 0 0 0 4px ${c.hex}` : 'none';
    if (document.documentElement.classList.contains('dark') && c.hex === state.pickedColor) {
      b.style.boxShadow = `0 0 0 2px #1b1f28, 0 0 0 4px ${c.hex}`;
    }
    b.addEventListener('click', () => { state.pickedColor = c.hex; renderSwatches(); });
    el.swatches.appendChild(b);
  });
}

function openFolderModal(folderId = null) {
  state.editingFolderId = folderId;
  const folder = folderId ? state.folders.find(f => f.id === folderId) : null;

  $('#folderModalTitle').textContent = folder ? 'Editar pasta' : 'Nova pasta';
  $('#btnSaveFolder').textContent = folder ? 'Salvar alterações' : 'Criar pasta';
  el.fFolderName.value = folder ? folder.name : '';
  state.pickedColor = folder ? folder.color : PALETTE[0].hex;
  el.folderError.classList.add('hidden');

  renderSwatches();
  show(el.folderModal);
  setTimeout(() => el.fFolderName.focus(), 40);
}

function saveFolder() {
  const name = el.fFolderName.value.trim();
  if (!name) {
    el.folderError.textContent = 'Dê um nome à pasta para continuar.';
    el.folderError.classList.remove('hidden');
    el.fFolderName.focus();
    return;
  }

  if (state.editingFolderId) {
    const i = state.folders.findIndex(f => f.id === state.editingFolderId);
    state.folders[i] = { ...state.folders[i], name, color: state.pickedColor };
    toast('Pasta atualizada');
  } else {
    const folder = { id: uid(), name, color: state.pickedColor };
    state.folders.push(folder);
    state.activeFolder = folder.id;
    toast('Pasta criada');
  }

  save(); render(); hide(el.folderModal);
}

/* ---------- confirmação ---------- */

let confirmAction = null;
function askConfirm(title, text, onConfirm) {
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  confirmAction = onConfirm;
  show(el.confirmModal);
}

/* ---------- ações ---------- */

function deleteLink(id) {
  const link = state.links.find(l => l.id === id);
  if (!link) return;
  askConfirm('Excluir link?',
    `“${link.title || hostOf(link.url)}” será removido deste navegador. Não dá para desfazer.`,
    () => { state.links = state.links.filter(l => l.id !== id); save(); render(); toast('Link excluído'); });
}

function deleteFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  const n = state.links.filter(l => l.folderId === id).length;
  const detail = n === 0
    ? 'A pasta está vazia e será removida.'
    : `Os ${n} ${n === 1 ? 'link' : 'links'} dentro dela também serão excluídos. Não dá para desfazer.`;

  askConfirm(`Excluir “${folder.name}”?`, detail, () => {
    state.folders = state.folders.filter(f => f.id !== id);
    state.links = state.links.filter(l => l.folderId !== id);
    if (state.activeFolder === id) state.activeFolder = 'all';
    save(); render(); toast('Pasta excluída');
  });
}

async function copyLink(id) {
  const link = state.links.find(l => l.id === id);
  if (!link) return;
  try {
    await navigator.clipboard.writeText(link.url);
    toast('Endereço copiado');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = link.url;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('Endereço copiado'); }
    catch { toast('O navegador bloqueou a cópia. Copie manualmente pelo card.', 'error'); }
    ta.remove();
  }
}

/* ---------- modais: abrir e fechar ---------- */

function show(modal) { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function hide(modal) {
  modal.classList.add('hidden');
  if (!document.querySelector('#linkModal:not(.hidden), #folderModal:not(.hidden), #confirmModal:not(.hidden)')) {
    document.body.style.overflow = '';
  }
}

document.querySelectorAll('[data-close]').forEach(b => {
  b.addEventListener('click', () => hide(b.closest('.fixed')));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('#linkModal, #folderModal, #confirmModal').forEach(m => {
      if (!m.classList.contains('hidden')) hide(m);
    });
    closeSidebar();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); el.search.focus(); }
});

$('#btnConfirm').addEventListener('click', () => {
  if (confirmAction) confirmAction();
  confirmAction = null;
  hide(el.confirmModal);
});

[el.fUrl, el.fTitle].forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') saveLink(); });
});
el.fFolderName.addEventListener('keydown', e => { if (e.key === 'Enter') saveFolder(); });

/* ---------- barra lateral no mobile ---------- */

function openSidebar() {
  el.sidebar.classList.remove('-translate-x-full');
  el.overlay.classList.remove('hidden');
}
function closeSidebar() {
  if (window.innerWidth < 768) el.sidebar.classList.add('-translate-x-full');
  el.overlay.classList.add('hidden');
}
$('#btnMenu').addEventListener('click', openSidebar);
el.overlay.addEventListener('click', closeSidebar);

/* ---------- tema ---------- */

function applyTheme(mode) {
  const dark = mode === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  $('#themeIcon').innerHTML = icon(dark ? ICONS.sun : ICONS.moon);
  $('#themeLabel').textContent = dark ? 'Modo claro' : 'Modo escuro';
  try { localStorage.setItem('marcador:theme', mode); } catch {}
  renderSwatches();
}

$('#btnTheme').addEventListener('click', () => {
  applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
});

/* ---------- eventos globais de clique ---------- */

document.addEventListener('click', e => {
  const t = e.target.closest('[data-folder],[data-edit-folder],[data-del-folder],[data-copy],[data-edit],[data-del]');
  if (!t) return;

  if (t.dataset.folder)      { state.activeFolder = t.dataset.folder; render(); closeSidebar(); }
  if (t.dataset.editFolder)  openFolderModal(t.dataset.editFolder);
  if (t.dataset.delFolder)   deleteFolder(t.dataset.delFolder);
  if (t.dataset.copy)        copyLink(t.dataset.copy);
  if (t.dataset.edit)        openLinkModal(t.dataset.edit);
  if (t.dataset.del)         deleteLink(t.dataset.del);
});

$('#btnNewFolder').addEventListener('click', () => openFolderModal());
$('#btnNewLink').addEventListener('click', () => openLinkModal());
$('#btnSaveLink').addEventListener('click', saveLink);
$('#btnSaveFolder').addEventListener('click', saveFolder);

/* ---------- busca ---------- */

el.search.addEventListener('input', e => {
  state.query = e.target.value;
  el.clearSearch.classList.toggle('hidden', !state.query);
  renderLinks();
});
el.clearSearch.addEventListener('click', () => {
  el.search.value = '';
  state.query = '';
  el.clearSearch.classList.add('hidden');
  renderLinks();
  el.search.focus();
});

/* ---------- inicialização ---------- */

(function init() {
  let saved = 'dark';
  try { saved = localStorage.getItem('marcador:theme') || 'dark'; } catch {}
  applyTheme(saved);
  load();
  render();
})();
</script>
</body>
</html>
